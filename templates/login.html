<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechTitans | Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="logo">TechTitans</div>

    <nav>
        <a href="/">Home</a>
    </nav>
</header>

<section class="login-section">

    <div class="login-card">

        <h1>Admin Login</h1>

        <p class="subtitle">
            Login to access the TechTitans Admin Panel.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form action="/admin/login" method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <a href="/" class="back-link">
            ← Back to Home
        </a>

    </div>

</section>

<footer>
    <p>© 2026 TechTitans | Online Verification System</p>
</footer>

</body>
</html>
